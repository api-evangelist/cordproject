name: cordproject
description: Cord Project Inc. was a New York based startup founded around 2014 by former Google
  Creative Lab designers Thomas Gayno and Jeff Baxter. Its flagship product, Cord, was a voice
  messaging app that let people send short audio clips as a middle ground between texting and phone
  calls. The company raised seed funding from investors including Google Ventures, Greycroft, Lerer
  Hippeau, Metamorphic Ventures and Slow Ventures, and was acquired by Spotify in January 2016 to
  explore new ways of interacting with audio. There is no public developer API, SDK, or documentation;
  this profile is retained as a Slow Ventures portfolio lead in the API Evangelist network.
